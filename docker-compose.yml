name: taskdeck

services:
  xiaocan-panel:
    image: ghcr.io/xiaoge-libai/taskdeck:latest
    container_name: taskdeck
    restart: unless-stopped
    ports:
      - "3001:3001"
      # 8100 仅供明确需要后端直连的 runner/反向代理使用，不要默认暴露公网。
      # - "127.0.0.1:8100:8100"
    environment:
      TZ: Asia/Shanghai
      # 管理员在部署时直接配置；空库缺变量或口令不合规会拒绝启动（见 README）。
      # 填在仓库根目录 .env（已忽略）后 docker compose up -d 自动读取。
      PANEL_ADMIN_EMAIL: ${PANEL_ADMIN_EMAIL:-}
      PANEL_ADMIN_PASSWORD: ${PANEL_ADMIN_PASSWORD:-}
      THREADS: "4"
      # WORKERS 必须为 1，扫码会话暂不支持跨进程共享。
    volumes:
      # 必须挂整个目录：数据库、上传图标、安装状态、运行密钥、日志。
      - xiaocan-data:/app/server/data
      # 可选旧配置迁移/敏感配置覆盖，文件必须提前存在：
      # - ./server/config.local.json:/app/server/config.local.json:ro
    # 使用宿主目录时可设置 user: "1000:1000"，并确保目录属于相同 UID/GID。
    # 命名卷默认使用镜像内 appuser（10001:10001），勿用 chmod 777。

  # ── 可选：第三方「小蚕小帮手」（xiaocan-assistant 1.0.1）────────────────────
  # 该项目没有 LICENSE 文件，属未授权代码：仅在本机构建使用，不随镜像发布、源码不进本仓库。
  # 构建（在源码目录执行一次）：
  #   docker build --network host -t xiaocan-assistant:1.0.1 .
  # 启用：
  #   docker compose --profile assistant up -d
  # 访问（无鉴权，故只绑本机）：
  #   ssh -N -L 8690:127.0.0.1:8690 <user>@<host>  然后开 http://127.0.0.1:8690
  xiaocan-assistant:
    profiles: ["assistant"]
    image: xiaocan-assistant:1.0.1
    container_name: xiaocan-assistant
    restart: unless-stopped
    ports:
      - "127.0.0.1:8690:8690"
    environment:
      TZ: Asia/Shanghai
      XIAOCAN_RELOAD: "0"
    volumes:
      - ./docker/assistant-data:/app/backend/data
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8690/health\")' || exit 1"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  xiaocan-data:
